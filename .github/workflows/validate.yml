name: Validar EstudosFlix

on:
  push:
    branches: [foundation/mvp-offline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Executar testes
        run: npm test
      - name: Validar build de produção
        run: npm run build
